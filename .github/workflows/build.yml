name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 校验 PowerShell 脚本编码
        shell: pwsh
        run: |
          # devup.ps1 含中文，必须是 UTF-8 with BOM，否则 PowerShell 5.1 会按 GBK 解析而报错
          $file = 'src/DevUp/Scripts/devup.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($file)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "$file 缺少 UTF-8 BOM"
          }
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file), [ref]$null, [ref]$errors)
          if ($errors -and $errors.Count) { throw "脚本语法错误: $errors" }
          Write-Host "devup.ps1 编码与语法检查通过"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore src/DevUp/DevUp.csproj

      - name: 编译
        run: dotnet build src/DevUp/DevUp.csproj -c Release --no-restore

      - name: 验证便携路径与 PowerShell 调用
        run: dotnet run --project tests/DevUp.PortableTests -c Release

      - name: 验证弹窗与主窗口交互
        run: dotnet run --project tests/DevUp.PortableTests -c Release --no-restore -- --dialogs-only

      - name: 验证 winget 列表解析
        shell: powershell
        run: ./tests/Test-WingetList.ps1

      - name: 验证实时终端输出
        run: dotnet run --project tests/DevUp.PortableTests -c Release --no-restore -- --console-only

      - name: 发布单文件
        run: >
          dotnet publish src/DevUp/DevUp.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o build/single-file

      - name: 校验发布目录只有一个 exe
        shell: pwsh
        run: |
          $files = @(Get-ChildItem build/single-file -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'DevUp.exe') {
            throw '发布目录未满足单文件分发要求'
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DevUp-win-x64-single-file
          path: build/single-file/DevUp.exe
          if-no-files-found: error
