FileKey2=%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Code Cache|*|RECURSE
FileKey3=%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\GPUCache|*|RECURSE

[Visual Studio Code 缓存]
