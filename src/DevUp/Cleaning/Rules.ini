; DevUp 自有清理规则（MIT），使用 FluentCleaner 的 Winapp2 格式解析器。
; 只扫描精确的缓存子目录；临时文件保留最近七天，转储及报告保留最近一天。

[用户临时文件]
Section=系统垃圾
DetectFile=%TEMP%
Default=True
Warning=仅清理七天前未修改的临时文件，跳过正在使用的文件。
FileKey1=%TEMP%|*|RECURSE

[Windows 临时文件]
Section=系统垃圾
DetectFile=%WINDIR%\Temp
Default=True
Warning=仅清理七天前未修改的临时文件；部分文件需要管理员权限。
FileKey1=%WINDIR%\Temp|*|RECURSE

[Windows 错误报告]
Section=系统垃圾
DetectFile1=%LOCALAPPDATA%\Microsoft\Windows\WER
DetectFile2=%PROGRAMDATA%\Microsoft\Windows\WER
Default=False
Warning=清理一天前的已归档或排队错误报告，将失去相关故障诊断资料。
FileKey1=%LOCALAPPDATA%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey2=%LOCALAPPDATA%\Microsoft\Windows\WER\ReportQueue|*|RECURSE
FileKey3=%PROGRAMDATA%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey4=%PROGRAMDATA%\Microsoft\Windows\WER\ReportQueue|*|RECURSE

[应用崩溃转储]
Section=系统垃圾
DetectFile=%LOCALAPPDATA%\CrashDumps
Default=False
Warning=清理一天前的崩溃转储，将失去相关故障诊断资料。
FileKey1=%LOCALAPPDATA%\CrashDumps|*.dmp

[系统崩溃转储]
Section=系统垃圾
DetectFile1=%WINDIR%\Minidump
DetectFile2=%WINDIR%\LiveKernelReports
Default=False
Warning=清理一天前的转储，通常需要管理员权限；将失去相关故障诊断资料。
FileKey1=%WINDIR%\Minidump|*.dmp
FileKey2=%WINDIR%\LiveKernelReports|*.dmp|RECURSE

[缩略图缓存]
Section=系统缓存
DetectFile=%LOCALAPPDATA%\Microsoft\Windows\Explorer
Default=True
Warning=缩略图会在下次浏览时重新生成；占用中的文件会跳过。
FileKey1=%LOCALAPPDATA%\Microsoft\Windows\Explorer|thumbcache_*.db

[DirectX 着色器缓存]
Section=系统缓存
DetectFile=%LOCALAPPDATA%\D3DSCache
Default=True
Warning=游戏或图形应用下次启动时可能需要重新编译着色器。
FileKey1=%LOCALAPPDATA%\D3DSCache|*|RECURSE

[NVIDIA 着色器缓存]
Section=系统缓存
DetectFile1=%LOCALAPPDATA%\NVIDIA\DXCache
DetectFile2=%LOCALAPPDATA%\NVIDIA\GLCache
Default=True
Warning=下次运行图形应用时将重新生成着色器缓存。
FileKey1=%LOCALAPPDATA%\NVIDIA\DXCache|*|RECURSE
FileKey2=%LOCALAPPDATA%\NVIDIA\GLCache|*|RECURSE

[AMD 着色器缓存]
Section=系统缓存
DetectFile1=%LOCALAPPDATA%\AMD\DxCache
DetectFile2=%LOCALAPPDATA%\AMD\GLCache
Default=True
Warning=下次运行图形应用时将重新生成着色器缓存。
FileKey1=%LOCALAPPDATA%\AMD\DxCache|*|RECURSE
FileKey2=%LOCALAPPDATA%\AMD\GLCache|*|RECURSE

[Microsoft Edge 缓存]
Section=浏览器缓存
DetectFile=%LOCALAPPDATA%\Microsoft\Edge\User Data
Default=True
Warning=请先退出 Edge；仅清理缓存，保留密码、Cookie、收藏夹及浏览历史。
FileKey1=%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache|*|RECURSE
FileKey2=%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache|*|RECURSE
FileKey3=%LOCALAPPDATA%\Microsoft\Edge\User Data\*\GPUCache|*|RECURSE

[Google Chrome 缓存]
Section=浏览器缓存
DetectFile=%LOCALAPPDATA%\Google\Chrome\User Data
Default=True
Warning=请先退出 Chrome；仅清理缓存，保留密码、Cookie、收藏夹及浏览历史。
FileKey1=%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache|*|RECURSE
FileKey2=%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache|*|RECURSE
FileKey3=%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache|*|RECURSE

[Firefox 缓存]
