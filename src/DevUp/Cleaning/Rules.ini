DetectFile=%LOCALAPPDATA%\Mozilla\Firefox\Profiles
Default=True
Warning=请先退出 Firefox；仅清理 cache2，保留密码、Cookie、收藏夹及浏览历史。
FileKey1=%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2|*|RECURSE

[Brave 缓存]
