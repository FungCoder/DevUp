FileKey2=%APPDATA%\Code\CachedData|*|RECURSE
FileKey3=%APPDATA%\Code\Code Cache|*|RECURSE
FileKey4=%APPDATA%\Code\GPUCache|*|RECURSE

[Discord 缓存]
