Warning=请先退出 Discord；保留账户及设置。
FileKey1=%APPDATA%\discord\Cache|*|RECURSE
FileKey2=%APPDATA%\discord\Code Cache|*|RECURSE
FileKey3=%APPDATA%\discord\GPUCache|*|RECURSE

[Slack 缓存]
Section=软件缓存
DetectFile=%APPDATA%\Slack
Default=True
Warning=请先退出 Slack；保留登录数据及设置。
FileKey1=%APPDATA%\Slack\Cache|*|RECURSE
FileKey2=%APPDATA%\Slack\Code Cache|*|RECURSE
FileKey3=%APPDATA%\Slack\GPUCache|*|RECURSE

[Spotify 缓存]
Section=软件缓存
DetectFile=%LOCALAPPDATA%\Spotify\Browser
Default=True
